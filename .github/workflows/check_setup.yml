# Is the live deployment actually wired up? One dispatch, one checklist.
#
# WHY THIS EXISTS. Answering "did that setting take effect" meant opening /api/config on a
# phone and reading a wall of unformatted JSON, twice, and the thing that mattered — one
# false among thirty fields — was the easiest part to miss. A runner can reach the backend
# and can lay the answer out, so it does.
#
# IT REPORTS, IT DOES NOT GATE. A half-configured backend is the normal state WHILE somebody
# is configuring it, and a red X on a run that was never meant to be green trains people to
# ignore red. Every check prints its own tick or cross and the job ends green regardless.
#
# NO SECRETS ARE PRINTED. Every value here is reduced to a yes or no before it reaches the
# summary, and the two endpoints are chosen for that: /api/config is public by design, and
# /api/telegram/status returns booleans and a webhook URL rather than tokens. The tools
# token rides in a query string to a backend that expects it and is never echoed.
name: Check the live setup

on:
  workflow_dispatch:
    inputs:
      register:
        description: "Also register the Telegram bot (webhook + join tracking + menu)"
        required: false
        default: false
        type: boolean
      # SO A CHAT ID CAN BE CHECKED BEFORE IT IS SAVED. The backend can answer this, but
      # only under the tools token — which lives here as a secret and nowhere a person is
      # holding. An endpoint that cannot be called from anywhere it is needed is not a
      # tool, it is a note about one.
      chat_id:
        description: "Also check a Telegram chat id (e.g. -1004417868848) without setting it"
        required: false
        default: ""
        type: string

concurrency:
  group: corner-check-setup

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      # REGISTERING IS A POST WITH A TOKEN, which is a terminal command, and needing one
      # to finish setting up a Telegram bot is a step that simply does not get done. The
      # runner already holds the token and can reach the backend, so it is a checkbox here
      # instead — and it runs BEFORE the checks, so one dispatch both fixes and verifies
      # rather than reporting a state it was about to change.
      - name: Register the bot
        if: inputs.register
        env:
          BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND/api/" || true)
            echo "wake attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          code=$(curl -s -o reg.json -w '%{http_code}' --max-time 60 -X POST \
            "$BACKEND/api/telegram/register?token=$TOOLS_TOKEN" || echo 000)
          echo "register: HTTP $code"
          # The body names the webhook it set and whether the menu went up. No token is in
          # it — the response echoes the URL, not what authorised the call.
          python3 -c "import json;d=json.load(open('reg.json'));print(json.dumps(d,indent=2))" \
            2>/dev/null || head -c 400 reg.json
          if [ "$code" != "200" ]; then
            echo "::warning::registration failed (HTTP $code) — the checks below will say what is still missing"
          fi

      - name: Ask the backend
        env:
          BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
          # WHERE THE DAILY POSTS LAND. These are GitHub secrets read by the posting
          # workflows, not Render variables, so the backend cannot report them and the
          # question "does any of this go to the paid channel" had no answer anywhere.
          # Compared, never printed — an id in a public log is a chat anybody can post to
          # if they also have the token.
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_SLIP: ${{ secrets.TELEGRAM_SLIP_CHAT_ID }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          if [ -z "$TG_SLIP" ] || [ "$TG_SLIP" = "$TG_CHAT" ]; then
            echo "same" > slip_target.txt
          else
            echo "separate" > slip_target.txt
          fi
          # Render sleeps the free instance; the first call after a quiet spell can take
          # most of a minute or fail outright, which is not a configuration problem.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND/api/" || true)
            echo "wake attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          # THE STATUS CODES ARE RECORDED, not just the bodies. Without them a backend that
          # never answered renders identically to one that answered "nothing is configured" —
          # every row a cross either way — and those need completely different action. Same
          # distinction the join page's own diagnostic draws between "reached, value empty"
          # and "UNREACHABLE".
          cfg_code=$(curl -s -o config.json -w '%{http_code}' --max-time 60 \
            "$BACKEND/api/config" || echo 000)
          tg_code=$(curl -s -o tg.json -w '%{http_code}' --max-time 60 \
            "$BACKEND/api/telegram/status?token=$TOOLS_TOKEN" || echo 000)
          # ASKS STRIPE, rather than asking whether the variables are filled in. /api/config's
          # stripe_ready is the latter and reported this setup as live over a key that had
          # been pasted without its secret; the first thing to say otherwise was a red toast
          # on the join page. This endpoint makes the call Stripe would make at checkout.
          sk_code=$(curl -s -o stripe.json -w '%{http_code}' --max-time 90 \
            "$BACKEND/api/billing/status?token=$TOOLS_TOKEN" || echo 000)
          echo "config: HTTP $cfg_code | telegram: HTTP $tg_code | stripe: HTTP $sk_code"
          printf '%s %s %s' "$cfg_code" "$tg_code" "$sk_code" > codes.txt
          # Checking a candidate id costs one Telegram call and saves a redeploy cycle. The
          # id is not secret — it is in the web.telegram.org URL of the channel — and it is
          # typed into the dispatch form by the person asking, so echoing it back is how
          # they confirm the runner read what they meant.
          if [ -n "${CHAT_ID:-}" ]; then
            probe_code=$(curl -s -o probe.json -w '%{http_code}' --max-time 60 \
              "$BACKEND/api/telegram/chat?token=$TOOLS_TOKEN&chat_id=$CHAT_ID" || echo 000)
            echo "probe $CHAT_ID: HTTP $probe_code"
            python3 -c "import json;print(json.dumps(json.load(open('probe.json')),indent=2))" \
              2>/dev/null || head -c 400 probe.json
          fi
          [ "$cfg_code" = "200" ] || echo '{}' > config.json
          [ "$tg_code" = "200" ] || echo '{}' > tg.json
          [ "$sk_code" = "200" ] || echo '{}' > stripe.json

      - name: Lay it out
        run: |
          # tee, NOT a plain redirect. The summary renders beautifully in the browser and
          # is invisible everywhere else — it is not in the job log, so anyone reading the
          # run through the API or the CLI sees a job that says "summary written" and
          # nothing about what it found. The same text goes to both.
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json

          def load(p):
              try:
                  with open(p) as f:
                      return json.load(f)
              except Exception:
                  return {}

          cfg, tg, sk = load("config.json"), load("tg.json"), load("stripe.json")
          # RENDERED WITH THE TABLE, not left in the step that fetched it. The runner echoes
          # every line of this script into the log before running it, which pushes an earlier
          # step's output beyond what the logs API will return — so a probe printed up there
          # is readable in the browser and nowhere else. Same failure as writing only to the
          # step summary: output nobody can reach is not output.
          probe = load("probe.json")
          try:
              cfg_code, tg_code, sk_code = open("codes.txt").read().split()
          except Exception:
              cfg_code = tg_code = sk_code = "000"
          vip = tg.get("vip_channel") or {}
          sign = cfg.get("signup") or {}

          def row(ok, label, detail="", mark=None):
              print(f"| {mark or ('✅' if ok else '❌')} | {label} | {detail} |")

          try:
              slip_target = open("slip_target.txt").read().strip()
          except Exception:
              slip_target = "same"

          print("## Live setup\n")
          # SAID BEFORE THE TABLE, because if the backend never answered then every cross
          # below means "unknown" rather than "off", and reading them as settings to fix
          # sends somebody to the Render dashboard over what is actually a cold instance.
          if cfg_code != "200":
              print(f"> ⚠️ **The backend did not answer** (`/api/config` returned "
                    f"`{cfg_code}`). Every cross below is unknown, not off. Render sleeps the "
                    "free instance — try again in a minute.\n")
          elif tg_code != "200":
              print(f"> ⚠️ `/api/telegram/status` returned `{tg_code}` — the Telegram rows "
                    "below are unknown. A 403 there means the TOOLS_TOKEN secret does not "
                    "match the backend's.\n")
          print("| | Check | |")
          print("|---|---|---|")

          # PAYMENTS FIRST, because everything else hangs off them: with no Stripe keys the
          # join page falls back to a Payment Link that carries no trial and cannot be tied
          # to an account, so the trial, the signup window and the channel invite are all
          # unreachable however well they are configured.
          # TWO ROWS, NOT ONE, because "the variables are filled in" and "Stripe accepts
          # them" are different facts and this checklist used to print only the first while
          # sounding like the second. The second one is the one that decides whether anybody
          # can join.
          ready = bool(cfg.get("stripe_ready"))
          row(ready, "Stripe keys set",
              "" if ready else "NOT configured — the join page is on the old payment link")
          if sk_code == "200":
              works = bool(sk.get("ok"))
              detail = sk.get("error") or ""
              if works:
                  p = sk.get("price") or {}
                  acct = (sk.get("account") or {}).get("name") or ""
                  detail = f"{p.get('amount','?')} / {p.get('interval','?')}"
                  if acct:
                      detail += f" — {acct}"
              row(works, "Stripe accepts them", detail)
              # Has no default and is not optional: create_checkout_session builds the
              # return address from it, and Stripe refuses a relative one. Its own row
              # because it fails for a reason that has nothing to do with the key.
              site = sk.get("site_url_ok")
              if site is not None:
                  row(bool(site), "SITE_URL",
                      sk.get("site_url") or "not set — Stripe needs a full https:// address")
          elif ready:
              # Older backend, or a token mismatch. Say which rather than printing a cross
              # that reads as "Stripe is broken".
              row(False, "Stripe accepts them",
                  f"could not check (HTTP {sk_code}) — deploy the backend, or check TOOLS_TOKEN",
                  mark="⚠️")
          days = cfg.get("trial_days")
          row(bool(days), "Free trial", f"{days} days" if days else "off")
          # ALWAYS A TICK, because both states are correct and only one of them was being
          # shown as one. SIGNUP_DAY=0 is how the window is deliberately turned off, and
          # printing a red cross over "always open" reports a setting somebody had just
          # chosen on purpose as a fault to go and fix. This row says what the policy IS;
          # the failure it used to imply does not exist.
          row(True, "Signup window",
              f"{sign.get('day_name','?')}s, scope {sign.get('scope','?')}"
              + (", OPEN today" if sign.get("open") else ", SHUT today")
              if sign.get("enabled") else "always open — no day restriction")

          print("| | | |")
          row(bool(tg.get("bot_token_set")), "Telegram bot token", "")
          # Named explicitly because the variable is easy to mistype, and the bot fails
          # CLOSED without it: every delivery gets a 403 and the bot simply never answers.
          row(bool(tg.get("webhook_secret_set")), "TELEGRAM_WEBHOOK_SECRET",
              "" if tg.get("webhook_secret_set") else "check the name is exactly this")
          hook = (tg.get("telegram") or {}).get("url") or ""
          row(bool(hook), "Webhook registered", hook.split("/api")[0] if hook else "run /api/telegram/register")
          mu = tg.get("member_updates")
          row(mu is True, "Channel join tracking",
              "" if mu is True else "re-register — chat_member updates are not being sent")

          print("| | | |")
          row(bool(vip.get("chat_id_set")), "TELEGRAM_VIP_CHAT_ID", "")
          # NAMES WHAT THE ID POINTS AT, not just that something answered. A blank title
          # here meant a private chat and read as a cosmetic gap, while every row below it
          # blamed the bot's permissions for an id that was never the channel.
          kind = vip.get("type")
          reach = bool(vip.get("reachable"))
          row(reach and kind != "private", "Bot can see the channel",
              (vip.get("title") or "") + (f" ({kind})" if kind else "")
              if reach else "")
          row(bool(vip.get("can_invite")), "Bot can create invites",
              vip.get("error") or "")

          # WHERE THINGS ARE SENT, which is a different question from whether they work and
          # the one that decides whether a paying channel gets filled with working notes.
          # Nothing is ever posted to the VIP channel: TELEGRAM_VIP_CHAT_ID is used only to
          # mint, revoke and enforce invites, never as a send target. The one setting that
          # could route a post anywhere else is TELEGRAM_SLIP_CHAT_ID.
          # A CANDIDATE ID, CHECKED WITHOUT BEING SAVED. Printed next to the live rows so
          # the two can be compared at a glance — which is the whole question being asked:
          # is the one I am about to paste better than the one that is in there.
          if probe:
            print("| | | |")
            pid = probe.get("probed") or "?"
            ptype = probe.get("type") or "unreachable"
            row(probe.get("type") in ("channel", "supergroup"),
                f"Candidate {pid}",
                (probe.get("title") or "") + f" ({ptype})")
            row(bool(probe.get("can_invite")), "…can mint invites there",
                probe.get("error") or "")

          print("| | | |")
          row(True, "Daily posts, menu, best game", "your own chat — never the VIP channel")
          if slip_target == "same":
              row(True, "Morning board", "your own chat")
          else:
              row(False, "Morning board", "a SEPARATE chat — check that is not the VIP "
                  "channel; unset TELEGRAM_SLIP_CHAT_ID to send it to your own", mark="⚠️")

          print()
          if not ready:
              print("> **Stripe is the blocker.** Until `STRIPE_SECRET_KEY`, `STRIPE_PRICE_ID` "
                    "and `STRIPE_WEBHOOK_SECRET` are all set, the join page uses the old "
                    "payment link — which grants no trial and links to no account, so nothing "
                    "downstream of checkout can work.")
          elif sk_code == "200" and not sk.get("ok"):
              # The keys are set and Stripe will not take them, which is the state the join
              # page reports as ready. Whatever is above, this is what stops people joining.
              print(f"> **Nobody can join.** Stripe refuses this configuration: "
                    f"{sk.get('error') or 'unknown'}")
              key = sk.get("key") or {}
              if key.get("truncated"):
                  print(f">\n> The key in `STRIPE_SECRET_KEY` is {key.get('length')} "
                        "characters long. A real one is around a hundred — reveal it in "
                        "Stripe → Developers → API keys and copy the whole thing.")
          if not sk.get("webhook_secret_set") and sk_code == "200":
              # Checkout succeeds and membership never arrives: the money is taken, the
              # webhook that grants access is not trusted, and the person is left outside.
              print("\n> ⚠️ `STRIPE_WEBHOOK_SECRET` is not set — payments would go through "
                    "without anybody being granted membership.")
          last = (tg.get("telegram") or {}).get("last_error_message")
          if last:
              print(f"\n> Telegram's last delivery error: `{last}`")
          PY
