# Is the site actually up, and is the backend awake? One dispatch, one answer.
#
# WHY THIS EXISTS. "The site is not loading" has at least five causes and they need
# different reactions: the phone's signal, the apex domain not resolving, Vercel down, the
# Render instance asleep, or the backend genuinely broken. From a phone with one bar you
# cannot tell any of them apart, and neither can a dev container behind a proxy that
# refuses outbound hosts — which is where this question usually gets asked from.
#
# A GitHub runner has open internet and no DNS games, so it can answer all five.
#
# IT REPORTS, IT NEVER GATES. Same rule as check_setup.yml: a sleeping free instance is
# the normal overnight state, not a failure, and a red X on the expected case trains
# people to ignore red. Every line prints its own verdict and the job ends green.
#
# THE TIMING IS THE POINT, not just the status code. Render's free tier sleeps after
# inactivity and the FIRST request pays the cold start — thirty seconds or more — while
# every one after it is fast. A 200 alone cannot tell "awake" from "asleep, and I just
# woke it"; two requests back to back can, so that is what this does.
#
# BOTH SPELLINGS OF THE DOMAIN, because they are different DNS records and only one of
# them is in SITE_URL. An apex that does not resolve while www does is invisible to
# anybody who always types the www, and every share link this repo builds defaults to the
# APEX — so that gap would send every posted link to a dead address.
name: Is it up

on:
  workflow_dispatch:

concurrency:
  group: corner-is-it-up
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        env:
          BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
        run: |
          # -L follows the redirect an apex-to-www setup uses, and %{url_effective}
          # reports where it landed — which is the difference between "broken" and
          # "configured to redirect", and they look identical in a bare status code.
          probe () {
            local label="$1" url="$2"
            local out
            out=$(curl -sS -L -o /dev/null --max-time 45 \
              -w '%{http_code} %{time_total} %{url_effective}' "$url" 2>&1) || {
                echo "| ❌ | $label | did not respond — \`${out//|/ }\` |" >> "$GITHUB_STEP_SUMMARY"
                echo "FAIL $label: $out"
                return 0
              }
            local code=${out%% *} rest=${out#* }
            local secs=${rest%% *} landed=${rest#* }
            local mark="✅"
            [ "$code" = "200" ] || mark="⚠️"
            echo "| $mark | $label | HTTP $code in ${secs}s → $landed |" >> "$GITHUB_STEP_SUMMARY"
            echo "$label: HTTP $code in ${secs}s -> $landed"
          }

          {
            echo "## Is it up — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| | What | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          probe "Site (apex)" "https://thecornermodel.com"
          probe "Site (www)"  "https://www.thecornermodel.com"
          probe "Evidence page" "https://thecornermodel.com/evidence"

          # TWO BACKEND HITS, AND THE GAP BETWEEN THEM IS THE ANSWER. A cold start is the
          # first one paying thirty seconds and the second returning instantly; a backend
          # that was already awake answers both fast. One request cannot separate those.
          first=$(curl -sS -o /dev/null --max-time 90 -w '%{http_code} %{time_total}' \
                  "$BACKEND/api/" 2>&1 || echo "000 0")
          second=$(curl -sS -o /dev/null --max-time 45 -w '%{http_code} %{time_total}' \
                   "$BACKEND/api/" 2>&1 || echo "000 0")
          f_code=${first%% *}; f_time=${first#* }
          s_code=${second%% *}; s_time=${second#* }
          echo "backend: first=$first second=$second"

          verdict="awake — both requests fast"
          mark="✅"
          # 5s is well past a warm free-tier response and well short of a cold start, so
          # it separates the two without being sensitive to ordinary jitter.
          if [ "$f_code" != "200" ]; then
            verdict="NOT RESPONDING"; mark="❌"
          elif awk "BEGIN{exit !($f_time > 5)}"; then
            verdict="was ASLEEP — first request took ${f_time}s, it is awake now"
            mark="⚠️"
          fi
          {
            echo "| $mark | Backend | HTTP $f_code, ${f_time}s then ${s_time}s — $verdict |"
          } >> "$GITHUB_STEP_SUMMARY"

          # WHICH LAYER IS DEAD. Three timeouts across three windows PLUS a dead
          # /api/streaks — which is cached and does no window walk at all — killed the
          # "it is expensive" theory. A trivial endpoint answering in 0.2s beside every
          # data endpoint hanging with ZERO bytes is not a slow computation; it is
          # something underneath them that never returns.
          #
          # SO THIS SEPARATES THE TWO REMAINING CAUSES, which need opposite fixes:
          #
          #   CPU STARVATION — one request pins the single shared core and the event loop
          #     cannot serve anything else. Then /api/ goes slow WHILE a heavy request is
          #     in flight, and recovers after.
          #   THE DATABASE — Mongo queries never return, so every endpoint that touches
          #     it hangs while ones that do not stay fast however much else is running.
          #
          # The only way to tell them apart is to ask the trivial endpoint DURING a heavy
          # one, which is what the background job below is for. Measuring them one after
          # the other, as the last run did, cannot distinguish these at all.
          probe_json () {
            local label="$1" path="$2" secs="${3:-15}"
            local out
            out=$(curl -sS -o /dev/null --max-time "$secs" \
                  -w '%{http_code} %{time_total}' "$BACKEND$path" 2>&1) || out="TIMEOUT/ERR"
            echo "$label -> $out"
            echo "| | $label | \`$out\` |" >> "$GITHUB_STEP_SUMMARY"
          }

          echo "--- light endpoints, nothing else running ---"
          probe_json "/api/ (no db)"        "/api/"            10
          # THE ONE THAT NAMES THE CAUSE. /api/health pings Mongo and reports db true or
          # false, plus the scheduler and which screens are fresh — so it distinguishes
          # "the database refused us" (answers fast with db:false) from "the driver is
          # stuck" (hangs like everything else). It already existed; nothing was asking it.
          curl -sS --max-time 20 "$BACKEND/api/health" -o health.json \
            -w 'health HTTP %{http_code} in %{time_total}s\n' || echo "health TIMED OUT"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 1200 health.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat health.json 2>/dev/null || true; echo
          probe_json "/api/config"          "/api/config"      15
          probe_json "/api/leagues (db)"    "/api/leagues"     15

          # THE HOME PAGE'S OWN REQUEST, spelled exactly as the browser sends it —
          # days=7, show=all, min_run=5. That is the cache key, and a probe that asks for
          # anything else tests a path no visitor takes: ?days=1 misses the guard by
          # design and recomputes the lot, which is a fine control and a terrible way to
          # find out whether the front page works.
          probe_json "HOME PAGE (cached)" "/api/browse?days=7&show=all&min_run=5" 30

          # THE FILTERS. The cache key is days=7 + show=all + no day + min_run=5, which is
          # the landing request and nothing else. Every control on that page changes one of
          # those, so if the guard is the only thing standing between a visitor and the
          # full scan, the page loads and then dies the moment anybody uses it. Worth
          # knowing before anyone concludes the box is too small.
          # WHERE THE TIME GOES, stage by stage. Three rounds of narrowing by elimination
          # got as far as "it is the browse work" and then I guessed at which part and
          # shipped two caches on the guess. This asks instead. 150s because the thing
          # being measured is the thing that does not finish in 60.
          # WHERE THE DATABASE IS, and whether distance is even the problem. 90.9s for
          # 10.7MB is 120 KB/s, which a far-away cluster and a throttled one both produce
          # — and they need opposite fixes, one free and one paid. Round-trip time tells
          # them apart; a dashboard's region labels do not.
          echo "--- where is the db ---"
          curl -sS --max-time 60 \
            "$BACKEND/api/tools/where-is-the-db?token=$TOOLS_TOKEN" -o db.json \
            -w 'db-location HTTP %{http_code} in %{time_total}s\n' || echo "db-location TIMED OUT"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 1200 db.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat db.json 2>/dev/null || true; echo

          echo "--- profile ---"
          curl -sS --max-time 150 \
            "$BACKEND/api/tools/browse-profile?token=$TOOLS_TOKEN" -o prof.json \
            -w 'profile HTTP %{http_code} in %{time_total}s\n' || echo "profile TIMED OUT"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 900 prof.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat prof.json 2>/dev/null || true; echo

          probe_json "filter: show=streaks" "/api/browse?days=7&show=streaks&min_run=5" 25
          probe_json "filter: days=3"       "/api/browse?days=3&show=all&min_run=5"     25
          probe_json "filter: run=6"        "/api/browse?days=7&show=all&min_run=6"     25

          echo "--- /api/ WHILE a heavy request is in flight ---"
          curl -sS -o /dev/null --max-time 40 "$BACKEND/api/browse?days=1" &
          heavy=$!
          sleep 3
          probe_json "/api/ during heavy"   "/api/"            10
          probe_json "/api/leagues during heavy" "/api/leagues" 15
          wait $heavy 2>/dev/null || true

          echo "--- after it gave up ---"
          probe_json "/api/ after"          "/api/"            10

          cp b7.json browse.json 2>/dev/null || echo '{}' > browse.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              d = json.load(open("browse.json"))
          except Exception as e:
              print(f"| ❌ | Home page data | /api/browse did not return JSON: {e} |")
              raise SystemExit(0)
          total = d.get("total")
          countries = d.get("countries") or []
          cal = d.get("calendar") or []
          if total:
              soonest = min((g["date"] for c in countries for l in c.get("leagues", [])
                             for g in l.get("games", [])), default="?")
              print(f"| ✅ | Home page data | {total} fixtures across "
                    f"{len(countries)} countries, {len(cal)} days — next {soonest[:16]} |")
          else:
              # THE INTERESTING FAILURE, and the one worth spelling out: a 200 with an
              # empty tree. The page renders its "nothing matches" state and reads as
              # broken, so the summary has to say which kind of empty this is.
              print(f"| ⚠️ | Home page data | /api/browse returned 200 with **0 fixtures** "
                    f"in the next 7 days ({len(countries)} countries, {len(cal)} days). "
                    "The page is working; it has nothing to draw. Check the sync.|")
          PY

          {
            echo
            echo "A sleeping backend is normal overnight on the free tier: the site still"
            echo "loads, the boards are empty until the first request wakes it, and this"
            echo "run has just done that."
          } >> "$GITHUB_STEP_SUMMARY"
