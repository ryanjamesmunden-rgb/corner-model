# Refreshes the data twice a day, every 12 hours.
#
# HOW IT TRIGGERS, and the two ways this has already gone wrong:
#
#   1. Calling the gated `refresh-all` needed a GitHub secret. A secret is a piece of
#      setup that can be missing, and it was.
#   2. Just PINGING the backend assumed waking a sleeping instance would fire the boot
#      sync. The logs said `attempt 1: HTTP 200` — already awake, so no start, no sync.
#      Four days passed with green ticks and stale data.
#
# So it now calls `/api/sync/if-stale`, which needs no token and asks explicitly. That
# endpoint is safe to leave open because it is SELF-LIMITING rather than trusted: it does
# nothing unless the data is over STALE_HOURS old, and a lock blocks a second sync within
# 20 minutes. The most an unlimited caller can cause is the sync that was already due.
#
# STALE_HOURS (11) must stay BELOW the 12h gap between the cron times below. When both
# were 12 they met on the boundary: at each tick the data was ~11.97h old — not "older
# than 12" — so every other tick was rejected as fresh and the site refreshed once a day
# while everything here said twice. Change the cron and you must revisit that number;
# backend/tests/test_sync_cadence.py fails if the two ever meet again.
#
# The in-process APScheduler stays as a second trigger for when the process IS alive.
#
# COST: a routine sync only fetches fixtures missing from the permanent `fixture_stats`
# cache, so a normal run is a handful of calls, not a backfill.
name: Sync corner data

on:
  schedule:
    # Twice a day, every 12 hours. GitHub cron is best-effort and can run a few minutes
    # late under load, which does not matter for a twice-daily data pull.
    - cron: "0 7,19 * * *"
  # RE-ADDED after being removed on request, because removing it left no way to recover
  # from a stall — and there was one: four days stale with nothing able to force a sync
  # before the next 19:00 UTC tick. It is not a public button; it needs repo access, and
  # the sync it triggers is token-gated regardless. Remove it again if you would rather
  # wait out a stall than have the escape hatch.
  workflow_dispatch:

concurrency:
  group: corner-sync
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Repo variable if set, else the deployed backend. Not a secret — this URL is
      # already baked into the public frontend bundle.
      BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
    steps:
      - uses: actions/checkout@v4      # for the reporting script below

      - name: Wake the backend
        # Render cold starts take up to a minute and the first request often times out,
        # so the sync POST below lands on a warm instance instead of being the request
        # that gets dropped. A 200 here does NOT imply a sync happened — that was the
        # mistaken assumption the previous version rested on.
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND/api/" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done

      - name: Trigger the sync
        # /api/sync/if-stale needs NO TOKEN, so there is no secret to be missing. That
        # matters: the token version needed a GitHub secret, and a missing secret is
        # exactly how the data sat four days old behind green ticks.
        #
        # It is safe to leave open because it is self-limiting, not trusted: it does
        # nothing unless the data is over 11h old, and a DB lock blocks a second sync
        # within 20 minutes. The most anyone can trigger is the sync that was already due.
        run: |
          body=$(curl -s --max-time 120 -X POST "$BACKEND/api/sync/if-stale" || true)
          echo "response: $body"
          case "$body" in
            *'"syncing"'*)         echo "sync started" ;;
            *'"fresh"'*)           echo "::notice::data is already current — nothing to do" ;;
            *'"already_syncing"'*) echo "::notice::a sync is already running" ;;
            *'Not Found'*)
              echo "::error::backend has no /api/sync/if-stale — it is running an older build"; exit 1 ;;
            *) echo "::error::unexpected response from if-stale (backend down or erroring)"; exit 1 ;;
          esac

      # FREEZE THE PROJECTIONS, AFTER THE SYNC AND BEFORE THE GAMES.
      #
      # A projection is a number about a fixture that has not happened. Once it has, the
      # fixture leaves the upcoming window and the number is gone — and recomputing it
      # later produces a projection made with the benefit of the result, because every
      # game the two sides have played since is now in the sample. So a record built
      # afterwards would grade the model against a version of itself that knew more.
      #
      # Which means every day this does not run is a day that can never be graded. It sits
      # here, on the back of the sync, because the snapshot is only worth having when the
      # data behind it is fresh — and the endpoint refuses on stale data rather than
      # freezing numbers nobody should later be held to.
      #
      # NEVER FAILS THE JOB. The sync is the important half and it has already happened by
      # this point; a snapshot that could not be taken is a gap in a record, which is worth
      # a warning in the log and is not worth a red run that trains people to ignore red.
      - name: Freeze today's projections
        env:
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
        run: |
          code=$(curl -s -o snap.json -w '%{http_code}' --max-time 120 -X POST \
            -H 'Content-Type: application/json' -d '{"days":3}' \
            "$BACKEND/api/projections/snapshot?token=$TOOLS_TOKEN" || echo 000)
          status=$(python3 -c "import json;print(json.load(open('snap.json')).get('status',''))" 2>/dev/null || echo "")
          count=$(python3 -c "import json;print(json.load(open('snap.json')).get('entries',0))" 2>/dev/null || echo 0)
          echo "projections snapshot: HTTP $code status=$status entries=$count"
          case "$status" in
            created) echo "::notice::froze $count projections — gradeable once played" ;;
            exists)  echo "::notice::already snapshotted today — left untouched" ;;
            stale)   echo "::warning::data too old to snapshot — today cannot be graded" ;;
            *)       echo "::warning::projection snapshot did not run (HTTP $code)" ;;
          esac

      - name: Report what happened
        # A boot sync is a detached subprocess, so this is a progress check, not a
        # completion check. It exists so a dead sync shows up in the log instead of
        # leaving a green tick behind stale data — which is how this went unnoticed for
        # two days, twice.
        run: |
          sleep 90
          curl -s --max-time 60 "$BACKEND/api/sync/runs?limit=3" > runs.json || true
          python3 .github/workflows/report_sync.py < runs.json
