<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- The brand's ground, not black. #000000 was the default CRA ships and it is a
             different colour from every surface on the site, so the phone chrome above the
             page did not match the page. -->
        <meta name="theme-color" content="#0B0F14" />
        <meta name="description" content="Corner Model — football corner stats, streaks and value scanner" />

        <!-- THE ICON. There was none at all before this, so a tab, a bookmark and a link
             preview all fell back to the letter the host derives from the domain — a grey
             T. Four entries because no single file covers the field:
               favicon.svg   what modern browsers prefer, and the only one that stays sharp
               favicon.ico   still requested BY NAME at the site root by Windows, older
                             Safari and most feed readers, whatever the link tags say
               apple-touch   iOS home screen, which ignores both of the above
               manifest      Android home screen and the installable-app icon -->
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>Corner Model</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
