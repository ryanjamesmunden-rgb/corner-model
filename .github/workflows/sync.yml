# Refreshes the data twice a day, every 12 hours.
#
# WHY THIS EXPLICITLY TRIGGERS THE SYNC, having briefly not:
#
# A previous version only PINGED the backend, on the reasoning that waking a sleeping
# Render instance is a process start, which fires `_maybe_sync_on_boot`. That reasoning
# had a hole, and the logs showed it: `attempt 1: HTTP 200`, instantly. The instance was
# already awake, so there was no start, so there was no sync — and the twice-daily ping
# was itself part of what kept it warm. Four days passed with green ticks and stale data.
#
# So the sync is now asked for explicitly. `refresh-all` spends API credits and this app
# is public, so it is TOOLS_TOKEN-gated, which means this workflow needs the token as a
# repo secret. That is one piece of setup in exchange for a trigger that does not depend
# on guessing whether the host happened to restart.
#
# The in-process APScheduler stays as a second trigger for when the process IS alive.
# `refresh-all` ignores a call within 5 minutes of the last, so the two cannot stack.
#
# COST: a routine sync only fetches fixtures missing from the permanent `fixture_stats`
# cache, so a normal run is a handful of calls, not a backfill.
name: Sync corner data

on:
  schedule:
    # Twice a day, every 12 hours. GitHub cron is best-effort and can run a few minutes
    # late under load, which does not matter for a twice-daily data pull.
    - cron: "0 7,19 * * *"
  # RE-ADDED after being removed on request, because removing it left no way to recover
  # from a stall — and there was one: four days stale with nothing able to force a sync
  # before the next 19:00 UTC tick. It is not a public button; it needs repo access, and
  # the sync it triggers is token-gated regardless. Remove it again if you would rather
  # wait out a stall than have the escape hatch.
  workflow_dispatch:

concurrency:
  group: corner-sync
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Repo variable if set, else the deployed backend. Not a secret — this URL is
      # already baked into the public frontend bundle.
      BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
    steps:
      - uses: actions/checkout@v4      # for the reporting script below

      - name: Wake the backend
        # Render cold starts take up to a minute and the first request often times out,
        # so the sync POST below lands on a warm instance instead of being the request
        # that gets dropped. A 200 here does NOT imply a sync happened — that was the
        # mistaken assumption the previous version rested on.
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND/api/" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done

      - name: Trigger the sync
        env:
          # Repo secret, matching TOOLS_TOKEN in the Render environment:
          # Settings -> Secrets and variables -> Actions -> New repository secret.
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not set, so no sync can be triggered."
            echo "Add it under Settings > Secrets and variables > Actions, matching TOOLS_TOKEN in Render."
            exit 1
          fi
          body=$(curl -s --max-time 120 -X POST -G \
                   --data-urlencode "token=$SYNC_TOKEN" \
                   "$BACKEND/api/sync/refresh-all" || true)
          echo "response: $body"
          case "$body" in
            *'"syncing"'*)         echo "sync started" ;;
            *'"already_syncing"'*) echo "::notice::a sync was already running — nothing to do" ;;
            *'Bad or missing token'*)
              echo "::error::backend rejected the token — SYNC_TOKEN and TOOLS_TOKEN differ"; exit 1 ;;
            *'disabled'*)
              echo "::error::TOOLS_TOKEN is not set on the backend, so the endpoint is off"; exit 1 ;;
            *) echo "::error::unexpected response from refresh-all"; exit 1 ;;
          esac

      - name: Report what happened
        # A boot sync is a detached subprocess, so this is a progress check, not a
        # completion check. It exists so a dead sync shows up in the log instead of
        # leaving a green tick behind stale data — which is how this went unnoticed for
        # two days, twice.
        run: |
          sleep 90
          curl -s --max-time 60 "$BACKEND/api/sync/runs?limit=3" > runs.json || true
          python3 .github/workflows/report_sync.py < runs.json
