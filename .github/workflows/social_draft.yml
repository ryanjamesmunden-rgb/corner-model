# Builds the day's X post and sends it to your phone with a one-tap Post button.
#
# IT STILL NEVER POSTS BY ITSELF, and that is now a cost decision as well as a safety one.
# X ended its free tier in February 2026: every post through the API is billed, and a post
# containing a link — which is the whole point of these — costs about thirteen times one
# without. This route costs nothing, needs no developer app, and keeps a person between a
# bad data day and an audience. What it asks in return is one tap.
#
# THE ROTATION IS A TESTED MODULE, not a case statement in this file. See
# frontend/src/lib/postPlan.js: logic in a `run:` block can only be checked by pushing it
# and waiting until Thursday, which is exactly how a poster ends up silently skipping a
# day. The week it produces:
#
#   Mon  results — how the weekend's frozen streaks actually landed
#   Tue  streaks
#   Wed  one game (3 days)
#   Thu  streaks
#   Fri  one game (3 days) + freeze the weekend's streaks
#   Sat  one game (today)
#   Sun  one game (today)
#
# "One game" is a single fixture across three lines — when, who, and why — rather than a
# list. The board format fits six rows in a post by cramping each into one line, which
# reads as a price list; three lines about one game reads as a reason to look.
#
# MONDAY IS THE ONLY DAY WITH A FALLBACK. Its board can be empty for a reason that is
# nobody's fault — a weekend that was never snapshotted, or results not yet synced — so it
# drops back to streaks. Any other day being empty means there is genuinely nothing worth
# posting, and the right answer is silence, not a different board to fill the slot.
#
# DELIVERY. Telegram if TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set; otherwise a
# GitHub issue, exactly as before. That order is deliberate — it means the job keeps
# working before the bot exists, and nothing has to be switched over on the day it does.
#
# TIMEZONE, AND WHY THERE IS NO LONGER AN HOUR CHECK. GitHub cron is UTC only, and
# "lunchtime" is a LOCAL idea that moves twice a year. This used to fire at two UTC hours
# and drop whichever one wasn't 12:00 in London, so that the post landed at the same local
# time year round.
#
# That gate was eating the job. GitHub delays scheduled runs — routinely by half an hour,
# sometimes by hours — so the surviving cron frequently didn't land on 12 either, both
# runs were dropped, and the workflow went green having done nothing. Three of this
# workflow's first five runs skipped that way, at 12:06, 15:57 and 18:01 London, which is
# also how a real failure sat unnoticed underneath them.
#
# So: one cron, taken whenever it lands. The post drifts an hour between BST and GMT,
# which no reader will notice, and which is a far smaller price than a daily poster that
# silently skips days.
#
# FRIDAY FREEZES THE WEEKEND'S STREAKS. A streak row only exists while the run is alive —
# a team that misses drops off the board — so grading "how the streaks did" against
# Monday's board would count only the survivors and report a near-perfect week every week.
# The snapshot writes down what was claimed BEFORE kick-off, which is the only point at
# which it can be written down honestly. It runs AFTER the draft is delivered so a
# snapshot failure cannot cost you the post, and it fails loudly, because a missing Friday
# snapshot is a weekend that can never be graded.
#
# COST: one call to a cached backend endpoint. No API-Football credits, no X API credits.
name: Draft the X post

on:
  schedule:
    # ONE cron, and no gate on the hour it lands. See "TIMEZONE" at the top.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      board:
        description: "Which board (blank = whatever this weekday calls for)"
        required: false
        type: choice
        options: ["", "game", "streaks", "fixtures", "results"]

concurrency:
  group: corner-social-draft
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # the fallback delivery is an issue; nothing else is written

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: What day is it
        id: when
        # NO HOUR GATE. There used to be one, and it was quietly eating the job: two crons
        # fired and whichever did not land on London 12:00 was dropped. GitHub delays
        # scheduled runs — routinely by half an hour, sometimes by hours — so in practice
        # BOTH were often dropped and the run went green having done nothing. Three of the
        # first five runs of this workflow skipped that way, at 12:06, 15:57 and 18:01
        # London, and the failure that mattered was invisible underneath them.
        #
        # One cron, taken whenever it lands. The post drifts an hour between BST and GMT,
        # which nobody reading it will ever notice, and which is a far smaller price than
        # a poster that silently skips days.
        run: |
          weekday=$(TZ=Europe/London date +%u)   # 1=Mon .. 7=Sun
          echo "London time: $(TZ=Europe/London date '+%A %H:%M %Z')"
          echo "weekday=$weekday" >> "$GITHUB_OUTPUT"
          echo "tag=$(TZ=Europe/London date +%F)" >> "$GITHUB_OUTPUT"
          # Monday grades the Friday just gone — three days back, in London, so the tag
          # matches the one that run wrote rather than a UTC day that may differ.
          echo "friday=$(TZ=Europe/London date -d '3 days ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "pretty=$(TZ=Europe/London date '+%a %d %b')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wake the backend
        # Render sleeps the free instance; the first request after a quiet spell can be the
        # one that times out. Same reason sync.yml does this.
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND/api/" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
        env:
          BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}

      - name: Build the day's draft
        id: build
        # --board auto asks postPlan.js what this weekday is for, and takes its day window
        # too. A board named by hand on a manual run overrides both.
        #
        # Monday's fallback is applied HERE rather than in the plan module, because only
        # the caller can know whether the first attempt actually produced anything.
        run: |
          board="${{ inputs.board }}"
          weekday="${{ steps.when.outputs.weekday }}"
          set -- --board "${board:-auto}" --weekday "$weekday" --out draft.md --json-out draft.json
          if [ "${board:-auto}" = "auto" ] && [ "$weekday" = "1" ]; then
            set -- "$@" --tag "${{ steps.when.outputs.friday }}"
          elif [ "$board" = "results" ]; then
            set -- "$@" --tag "${{ steps.when.outputs.friday }}"
          fi
          node tools/social_draft.mjs "$@"

          if [ ! -s draft.md ] && [ "$weekday" = "1" ] && [ -z "$board" ]; then
            echo "::notice::no weekend results to report — falling back to the streak board"
            node tools/social_draft.mjs --board streaks --days 3 --out draft.md --json-out draft.json
          fi

          if [ ! -s draft.md ]; then
            echo "::notice::nothing to post today (stale data or a quiet board)"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://corner-model.vercel.app' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}

      - name: Send it to Telegram
        if: steps.build.outputs.empty != 'true' && env.TG_TOKEN != ''
        id: telegram
        # THE POST TEXT GOES IN THE MESSAGE BODY, not only behind the button. A button is
        # one tap when it works, and when it doesn't — a URL Telegram won't accept, an
        # app that opens the composer empty — the text still has to be there to copy, or
        # the post is lost for the day.
        #
        # Sent as plain text with no parse_mode: the post contains characters Markdown and
        # HTML both treat as syntax, and a message that fails to parse is a message that
        # never arrives.
        run: |
          python3 - <<'PY' > payload.json
          import json, os
          d = json.load(open("draft.json"))
          body = (f"{os.environ['PRETTY']} — {d['board']}\n"
                  f"{d['note']} · {d['weight']}/280\n\n"
                  f"{d['post']}")
          print(json.dumps({
              "chat_id": os.environ["TG_CHAT"],
              "text": body,
              "disable_web_page_preview": True,
              "reply_markup": {"inline_keyboard": [[
                  {"text": "Post on X", "url": d["intent"]}]]},
          }))
          PY
          code=$(curl -s -o tg.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H 'content-type: application/json' --data-binary @payload.json || true)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "::notice::sent to Telegram"
            echo "sent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A button URL Telegram refuses is the one predictable failure here — the intent
          # link carries the whole post in a query string and can get long. Retry without
          # it rather than lose the message: the text is in the body either way.
          echo "::warning::Telegram rejected the message with the button (HTTP $code) — retrying as plain text"
          python3 -c "import json;d=json.load(open('payload.json'));d.pop('reply_markup');print(json.dumps(d))" > plain.json
          code=$(curl -s -o tg2.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H 'content-type: application/json' --data-binary @plain.json || true)
          if [ "$code" = "200" ]; then
            echo "::notice::sent to Telegram without the button"
            echo "sent=true" >> "$GITHUB_OUTPUT"
          else
            # Not fatal: the issue step below picks it up, so the draft is never lost.
            echo "::warning::Telegram send failed (HTTP $code) — falling back to a GitHub issue"
            echo "sent=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRETTY: ${{ steps.when.outputs.pretty }}

      - name: Make sure the label exists
        # Only needed when an issue is actually going to be filed.
        if: steps.build.outputs.empty != 'true' && steps.telegram.outputs.sent != 'true'
        # Created here rather than by hand, so it is not a piece of setup that can be
        # missing. `gh label create` exits non-zero when the label already exists, which is
        # the normal case from the second run onward, so that is not an error.
        run: |
          if gh label create "social-draft" \
               --description "An X post drafted by the scheduled job, waiting for review" \
               --color "1D9BF0" 2>/dev/null; then
            echo "created the social-draft label"
          else
            echo "social-draft label already exists"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: File it as an issue instead
        # Only when Telegram is not configured, or did not take it. Never both — two copies
        # of the same draft is two things to check and one of them to forget.
        if: steps.build.outputs.empty != 'true' && steps.telegram.outputs.sent != 'true'
        run: |
          gh issue create \
            --title "X draft — ${{ steps.when.outputs.pretty }}" \
            --body-file draft.md \
            --label "social-draft"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Freeze the weekend's streaks
        # Friday only, and last: see the note at the top of this file for why this exists
        # and why it runs after the draft is delivered rather than before.
        if: steps.when.outputs.weekday == '5'
        run: |
          code=$(curl -s -o snap.json -w '%{http_code}' --max-time 120 -X POST \
            "$BACKEND/api/streaks/snapshot?token=$TOOLS_TOKEN" \
            -H 'content-type: application/json' \
            -d "{\"tag\":\"${{ steps.when.outputs.tag }}\",\"days\":3,\"limit\":8}" || true)
          # The token is in the URL, so the BODY is safe to print but the request is not.
          echo "HTTP $code"
          case "$code" in
            200) ;;
            403) echo "::error::backend rejected the token — check the TOOLS_TOKEN secret"; exit 1 ;;
            *)   echo "::error::snapshot failed (HTTP $code) — this weekend cannot be graded"; exit 1 ;;
          esac
          status=$(python3 -c "import json,sys; print(json.load(open('snap.json')).get('status',''))")
          count=$(python3 -c "import json,sys; print(len(json.load(open('snap.json')).get('entries') or []))")
          case "$status" in
            created) echo "::notice::froze $count streaks as tag ${{ steps.when.outputs.tag }}" ;;
            exists)  echo "::notice::already snapshotted today ($count streaks) — left untouched" ;;
            stale)
              echo "::error::data too old to snapshot — the weekend will not be gradeable"; exit 1 ;;
            *) echo "::error::unexpected snapshot status '$status'"; exit 1 ;;
          esac
        env:
          BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
