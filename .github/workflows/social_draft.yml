# Builds the day's X post and sends it to your phone with a one-tap Post button.
#
# IT STILL NEVER POSTS BY ITSELF, and that is now a cost decision as well as a safety one.
# X ended its free tier in February 2026: every post through the API is billed, and a post
# containing a link — which is the whole point of these — costs about thirteen times one
# without. This route costs nothing, needs no developer app, and keeps a person between a
# bad data day and an audience. What it asks in return is one tap.
#
# THE ROTATION IS A TESTED MODULE, not a case statement in this file. See
# frontend/src/lib/postPlan.js: logic in a `run:` block can only be checked by pushing it
# and waiting until Thursday, which is exactly how a poster ends up silently skipping a
# day. The week it produces:
#
#   Mon  picks     how the angles posted to the channel actually landed
#                  — AND the midweek card (Tue-Thu) to the paid channel
#   Tue  game      the midweek fixture with the strongest angle on it
#   Wed  streaks   what is trending — AND the weekend card (Fri-Mon) to the paid channel
#   Thu  —         nothing published. A day off, deliberately
#   Fri  game      the best game of the weekend
#   Sat  game      what is on today
#   Sun  game      what is on today
#
# THAT TABLE IS WHAT GOES OUT TO AN AUDIENCE. Two further messages go to YOU, every day
# including Thursday, and neither is a publication:
#
#   the angle menu      every angle the site has, numbered, to pick from
#   the day's best game the single strongest pick, with the animation, its own Post button
#
# The best-game message is SKIPPED on Tue/Fri/Sat/Sun, because on those days the public
# draft above already is that same pick rendered from the same call — and a daily poster
# that sends you the same thing twice is one you learn to ignore.
#
# THURSDAY IS SILENT ON PURPOSE, and that means silent towards an AUDIENCE. Every
# scheduling instinct says fill the public slot, and filling it is how an account starts
# posting things nobody needed to read. The two messages above have no audience but you,
# and the week's own description of Thursday is "scan the weekend" — which needs something
# to scan. So Thursday drafts nothing and still tells you what is coming.
#
# TWO CARDS A WEEK, AND EACH LANDS BEFORE THE GAMES IT COVERS. Monday sends the midweek
# card (Tue-Thu) and Wednesday the weekend one (Fri-Mon) — Wednesday being roughly when
# the weekend's prices appear, so the channel has them two clear days before anything
# public names those games. That gap is the product.
#
# The midweek card was frozen and graded from the day the second card existed and was
# never actually SENT, because only one send step was ever written. See the step itself.
#
# "One game" is a single fixture across three lines — when, who, and why — rather than a
# list. The board format fits six rows in a post by cramping each into one line, which
# reads as a price list; three lines about one game reads as a reason to look.
#
# MONDAY IS THE ONLY DAY WITH FALLBACKS, and it has a chain: picks → results → streaks.
# That order is a ranking of evidence — angles named in advance beat the model's board,
# and the model's board beats "here is what is running". Each can be empty through nobody's
# fault (no picks logged, a weekend never snapshotted, results not yet synced), so Monday
# walks down until something has rows. Any other day being empty means there is genuinely
# nothing worth posting, and the right answer is silence.
#
# DELIVERY. Telegram if TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set; otherwise a
# GitHub issue, exactly as before. That order is deliberate — it means the job keeps
# working before the bot exists, and nothing has to be switched over on the day it does.
#
# TIMEZONE, AND WHY THERE IS NO LONGER AN HOUR CHECK. GitHub cron is UTC only, and
# "lunchtime" is a LOCAL idea that moves twice a year. This used to fire at two UTC hours
# and drop whichever one wasn't 12:00 in London, so that the post landed at the same local
# time year round.
#
# That gate was eating the job. GitHub delays scheduled runs — routinely by half an hour,
# sometimes by hours — so the surviving cron frequently didn't land on 12 either, both
# runs were dropped, and the workflow went green having done nothing. Three of this
# workflow's first five runs skipped that way, at 12:06, 15:57 and 18:01 London, which is
# also how a real failure sat unnoticed underneath them.
#
# So: one cron, taken whenever it lands. The post drifts an hour between BST and GMT,
# which no reader will notice, and which is a far smaller price than a daily poster that
# silently skips days.
#
# THE CARD DAYS FREEZE THEIR OWN STREAKS. A streak row only exists while the run is alive —
# a team that misses drops off the board — so grading "how the streaks did" against
# Monday's board would count only the survivors and report a near-perfect week every week.
# The snapshot writes down what was claimed BEFORE kick-off, which is the only point at
# which it can be written down honestly. It runs AFTER the draft is delivered so a
# snapshot failure cannot cost you the post, and it fails loudly, because a missing
# snapshot is a set of days that can never be graded.
#
# COST: one call to a cached backend endpoint. No API-Football credits, no X API credits.
name: Draft the X post

on:
  schedule:
    # ONE cron, and no gate on the hour it lands. See "TIMEZONE" at the top.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      board:
        description: "Which board (blank = whatever this weekday calls for)"
        required: false
        type: choice
        options: ["", "picks", "game", "streaks", "fixtures", "results", "card", "menu", "finder"]
      count:
        # HOW MANY GAMES ON THE CARD. Blank uses angle_of_day.COUNT, which is what the
        # schedule publishes and what the site shows; the backend caps it at 10.
        description: "Card size (blank = the usual 8, max 10)"
        required: false
        default: ""
        type: string
      send:
        # BUILDING A CARD AND PUBLISHING ONE ARE DIFFERENT ACTS, and a manual run should
        # not have to be one to be the other. A card posted to the paid channel cannot be
        # unposted, so an off-schedule run builds it and writes it to this run's summary,
        # where it can be read before anyone decides to send it.
        #
        # The SCHEDULED run is unaffected: on a card day it sends, as it always did. This
        # only governs a run somebody started by hand.
        description: "Also post it to the channel (manual card runs only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: corner-social-draft
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # the fallback delivery is an issue; nothing else is written

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # BEFORE the day step, which now asks postPlan.js whether today is a quiet one.
      # Relying on whatever node the runner image happens to ship is the kind of thing
      # that works until the image changes.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: What day is it
        id: when
        # NO HOUR GATE. There used to be one, and it was quietly eating the job: two crons
        # fired and whichever did not land on London 12:00 was dropped. GitHub delays
        # scheduled runs — routinely by half an hour, sometimes by hours — so in practice
        # BOTH were often dropped and the run went green having done nothing. Three of the
        # first five runs of this workflow skipped that way, at 12:06, 15:57 and 18:01
        # London, and the failure that mattered was invisible underneath them.
        #
        # One cron, taken whenever it lands. The post drifts an hour between BST and GMT,
        # which nobody reading it will ever notice, and which is a far smaller price than
        # a poster that silently skips days.
        run: |
          weekday=$(TZ=Europe/London date +%u)   # 1=Mon .. 7=Sun
          echo "London time: $(TZ=Europe/London date '+%A %H:%M %Z')"
          echo "weekday=$weekday" >> "$GITHUB_OUTPUT"
          # THURSDAY IS SILENT, and the plan says so rather than this file — see
          # postPlan.js. Asked here rather than hardcoded so the week has exactly one
          # definition, and a manual run naming a board still overrides it.
          quiet=$(node -e "import('./frontend/src/lib/postPlan.js').then(m=>console.log(m.isQuietDay($weekday)?1:0))")
          if [ "$quiet" = "1" ] && [ -z "${{ inputs.board }}" ]; then
            echo "::notice::Thursday — the week says nothing today"
            echo "quiet=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$(TZ=Europe/London date +%F)" >> "$GITHUB_OUTPUT"
          # WHICH CARD, IF ANY, GOES OUT TODAY. Monday is the midweek (Tue-Thu), Wednesday
          # the weekend (Fri-Mon). `carddays` is how far the scan has to reach to cover it.
          # Blank on every other day, and the freeze step skips — see "Freeze the card".
          case "$weekday" in
            1) echo "card=midweek" >> "$GITHUB_OUTPUT"; echo "carddays=4" >> "$GITHUB_OUTPUT" ;;
            3) echo "card=weekend" >> "$GITHUB_OUTPUT"; echo "carddays=6" >> "$GITHUB_OUTPUT" ;;
            *) echo "card=" >> "$GITHUB_OUTPUT"; echo "carddays=0" >> "$GITHUB_OUTPUT" ;;
          esac
          # THE STREAK FINDER'S OWN DAYS, which are NOT the card's. Monday publishes the
          # weekend (Fri-Mon) and Thursday the midweek (Tue-Thu); between them every day of
          # the week belongs to exactly one drop. The card above runs Monday and Wednesday
          # on different windows entirely, so the two schedules are kept apart rather than
          # folded together — sharing one would silently repoint whichever was edited second.
          case "$weekday" in
            1|4) echo "finder=1" >> "$GITHUB_OUTPUT" ;;
            *)   echo "finder=" >> "$GITHUB_OUTPUT" ;;
          esac
          # Monday grades the Friday just gone — three days back, in London, so the tag
          # matches the one that run wrote rather than a UTC day that may differ.
          echo "friday=$(TZ=Europe/London date -d '3 days ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "pretty=$(TZ=Europe/London date '+%a %d %b')" >> "$GITHUB_OUTPUT"
          # WHICH BOARD THE WEEK CALLS FOR TODAY. Needed because the daily best-game post
          # below must not double up on the days the public draft is already a game — Tue,
          # Fri, Sat and Sun. Read from the plan rather than re-listed here, so the week
          # keeps exactly one definition.
          echo "board=$(node -e "import('./frontend/src/lib/postPlan.js').then(m=>console.log(m.boardForDay($weekday).board||''))")" >> "$GITHUB_OUTPUT"
          echo "plandays=$(node -e "import('./frontend/src/lib/postPlan.js').then(m=>console.log(m.boardForDay($weekday).days||3))")" >> "$GITHUB_OUTPUT"

      - name: Wake the backend
        # NO LONGER GATED ON THE QUIET DAY. Thursday publishes nothing, but the two
        # messages that go to you rather than to an audience still go out — and they need
        # the backend up.
        #
        # Render sleeps the free instance; the first request after a quiet spell can be the
        # one that times out. Same reason sync.yml does this.
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND/api/" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
        env:
          BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}

      - name: Build the day's draft
        id: build
        # `card` IS NOT A DRAFT BOARD, and neither is `finder`. Each has its own step
        # below, which is the one that knows whether this run is allowed to publish.
        # Letting the draft path build a card too meant `send: false` was a guard on one
        # of the two places that send: the card step honoured it, and the draft step
        # delivered anyway, so asking to SEE a card posted one. A flag that governs half
        # the sends is worse than none, because it is believed. The finder is excluded
        # here and from the generic Telegram step for exactly that reason, not by analogy.
        if: >-
          steps.when.outputs.quiet != 'true' && inputs.board != 'card'
          && inputs.board != 'finder'
        # --board auto asks postPlan.js what this weekday is for, and takes its day window
        # too. A board named by hand on a manual run overrides both.
        #
        # Monday's fallback is applied HERE rather than in the plan module, because only
        # the caller can know whether the first attempt actually produced anything.
        run: |
          board="${{ inputs.board }}"
          weekday="${{ steps.when.outputs.weekday }}"
          set -- --board "${board:-auto}" --weekday "$weekday" --out draft.md --json-out draft.json
          if [ "${board:-auto}" = "auto" ] && [ "$weekday" = "1" ]; then
            set -- "$@" --tag "${{ steps.when.outputs.friday }}"
          elif [ "$board" = "results" ]; then
            set -- "$@" --tag "${{ steps.when.outputs.friday }}"
          fi
          node tools/social_draft.mjs "$@"

          # MONDAY WALKS DOWN ITS CHAIN. picks → results → streaks, which is a ranking of
          # evidence: angles a person named in advance beat the model's board, and the
          # model's board beats "here is what is running". Each can be empty through
          # nobody's fault, so it tries the next rather than going silent. The chain lives
          # in postPlan.js so the week has one definition.
          if [ -z "$board" ]; then
            for next in $(node -e "import('./frontend/src/lib/postPlan.js').then(m=>console.log((m.boardForDay($weekday).fallbacks||[]).join(' ')))"); do
              [ -s draft.md ] && break
              echo "::notice::nothing on the previous board — falling back to $next"
              extra=""
              [ "$next" = "results" ] && extra="--tag ${{ steps.when.outputs.friday }}"
              node tools/social_draft.mjs --board "$next" --days 3 $extra --out draft.md --json-out draft.json
            done
          fi

          if [ ! -s draft.md ]; then
            echo "::notice::nothing to post today (stale data or a quiet board)"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thecornermodel.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
          # NEEDED BECAUSE --board menu CAN COME THROUGH HERE. The dedicated menu step
          # below is skipped on a manual dispatch that names a board, so a hand-fired
          # `board: menu` builds the menu in THIS step instead — and the menu has to be
          # stored against the chat it was sent to, or a reply of "3" resolves to nothing.
          # Without this the menu arrived fine and the store silently keyed itself to "".
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Draw the picture
        id: story
        # ONLY when the draft carries one. A streaks or results board has no single fixture
        # to draw a curve for, and installing a browser for a post that will not use it is
        # a minute of runner time spent on nothing.
        #
        # The image is DECORATION: every failure here is a warning, never an error. A post
        # that goes out as text is a post; a job that dies rendering a picture costs the
        # day for the sake of a graphic.
        if: steps.when.outputs.quiet != 'true' && steps.build.outputs.empty != 'true'
        run: |
          python3 -c "import json,sys; d=json.load(open('draft.json')); sys.exit(0 if d.get('story') else 1)" \
            || { echo "::notice::no fixture curve in today's draft — text only"; exit 0; }
          python3 -c "import json; d=json.load(open('draft.json')); json.dump(d['story'], open('story_args.json','w'))"
          npm i --no-save playwright@1.49.1 >/dev/null 2>&1 || {
            echo "::warning::could not install playwright — posting text only"; exit 0; }
          npx playwright install chromium >/dev/null 2>&1 || {
            echo "::warning::could not install chromium — posting text only"; exit 0; }
          # THE ANIMATION FIRST. A still is a picture of a chart; the clip counts the
          # percentage up and grows the bars, which is what stops a thumb on a Story.
          #
          # ffmpeg IS NOT ON THE RUNNER. It was assumed to be, and the assumption cost a
          # run: `command -v ffmpeg` failed silently, the && short-circuited with no output
          # at all, and the job fell through to the still reporting success. Installed
          # explicitly now, and the outcome is logged either way so a silent fallback
          # cannot happen twice.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "installing ffmpeg"
            sudo apt-get update -qq >/dev/null 2>&1 \
              && sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null 2>&1 \
              || echo "::warning::could not install ffmpeg"
          fi
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg: $(ffmpeg -version 2>/dev/null | head -1)"
          else
            echo "::warning::no ffmpeg — the animation cannot be encoded"
          fi

          if command -v ffmpeg >/dev/null 2>&1 \
             && node tools/render_story.mjs --args story_args.json --video story.mp4; then
            echo "drew=video" >> "$GITHUB_OUTPUT"
            echo "file=story.mp4" >> "$GITHUB_OUTPUT"
          elif node tools/render_story.mjs --args story_args.json --out story.png; then
            # A still is most of the value and none of the encoding risk, so a failed
            # video falls back here rather than costing the picture entirely.
            echo "::warning::could not encode the animation — sending the still instead"
            echo "drew=image" >> "$GITHUB_OUTPUT"
            echo "file=story.png" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the render failed — posting text only"
          fi

      - name: Send it to Telegram
        if: >-
          steps.when.outputs.quiet != 'true' && steps.build.outputs.empty != 'true'
          && inputs.board != 'card' && inputs.board != 'finder' && env.TG_TOKEN != ''
        id: telegram
        # THE POST TEXT GOES IN THE MESSAGE BODY, not only behind the button. A button is
        # one tap when it works, and when it doesn't — a URL Telegram won't accept, an
        # app that opens the composer empty — the text still has to be there to copy, or
        # the post is lost for the day.
        #
        # Sent as plain text with no parse_mode: the post contains characters Markdown and
        # HTML both treat as syntax, and a message that fails to parse is a message that
        # never arrives.
        run: |
          python3 - <<'PY' > payload.json
          import json, os
          d = json.load(open("draft.json"))
          # NOT EVERY BOARD IS AN X POST. The weekend card and the angle menu have no intent
          # link — one is a paid-channel card far past 280 characters, the other is a list to
          # choose from — so the "/280" and the Post button are attached only where they mean
          # something. A button with an empty URL is an HTTP 400 from Telegram, which would
          # send the whole message down the retry path to arrive stripped of its keyboard.
          intent = d.get("intent") or ""
          body = (f"{os.environ['PRETTY']} — {d['board']}\n"
                  f"{d['note']}" + (f" · {d['weight']}/280" if intent else "") + "\n\n"
                  f"{d['post']}")
          payload = {"chat_id": os.environ["TG_CHAT"], "text": body,
                     "disable_web_page_preview": True}
          if intent:
              payload["reply_markup"] = {"inline_keyboard": [[
                  {"text": "Post on X", "url": intent}]]}
          print(json.dumps(payload))
          PY
          # WITH THE PICTURE IF THERE IS ONE, AS A FILE RATHER THAN A PHOTO.
          #
          # sendPhoto COMPRESSES: Telegram re-encodes and caps the long side around 1280,
          # so a 1080x1920 card arrives as roughly 720x1280. That is fine to glance at and
          # not fine to post — the card is drawn at exactly Instagram Story size, and the
          # whole point of saving it is to put the full-resolution original up. sendDocument
          # stores the bytes untouched.
          #
          # It takes the same caption and the same inline keyboard, so the Post on X button
          # survives, and the caption cap is 1024 — comfortably above a post built for 280.
          # The image cannot ride along to X (an intent link carries text only), so it is
          # here to look at, to save, and to attach by hand.
          FILE="${{ steps.story.outputs.file }}"
          if [ -n "$FILE" ] && [ -s "$FILE" ]; then
            # The keyboard is omitted ENTIRELY rather than sent empty when the board has no
            # X post behind it. Telegram validates the shape, and `reply_markup={}` is not a
            # valid InlineKeyboardMarkup — it would fail the upload rather than be ignored.
            MARKUP=$(python3 -c "import json;d=json.load(open('payload.json'));print(json.dumps(d['reply_markup']) if 'reply_markup' in d else '')")
            set -- -F "chat_id=$TG_CHAT" -F "document=@$FILE" \
                   -F "caption=$(python3 -c "import json;print(json.load(open('payload.json'))['text'])")"
            [ -n "$MARKUP" ] && set -- "$@" -F "reply_markup=$MARKUP"
            code=$(curl -s -o tg.json -w '%{http_code}' --max-time 120 \
              -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" "$@" || true)
            echo "sendDocument HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::notice::sent to Telegram with the ${{ steps.story.outputs.drew }}, uncompressed"
              echo "sent=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::sendDocument failed (HTTP $code) — falling back to text"
          fi

          code=$(curl -s -o tg.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H 'content-type: application/json' --data-binary @payload.json || true)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "::notice::sent to Telegram"
            echo "sent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A button URL Telegram refuses is the one predictable failure here — the intent
          # link carries the whole post in a query string and can get long. Retry without
          # it rather than lose the message: the text is in the body either way.
          echo "::warning::Telegram rejected the message with the button (HTTP $code) — retrying as plain text"
          python3 -c "import json;d=json.load(open('payload.json'));d.pop('reply_markup',None);print(json.dumps(d))" > plain.json
          code=$(curl -s -o tg2.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H 'content-type: application/json' --data-binary @plain.json || true)
          if [ "$code" = "200" ]; then
            echo "::notice::sent to Telegram without the button"
            echo "sent=true" >> "$GITHUB_OUTPUT"
          else
            # Not fatal: the issue step below picks it up, so the draft is never lost.
            echo "::warning::Telegram send failed (HTTP $code) — falling back to a GitHub issue"
            echo "sent=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRETTY: ${{ steps.when.outputs.pretty }}

      - name: Make sure the label exists
        # Only needed when an issue is actually going to be filed.
        # `steps.build.outcome == 'success'` IS THE CONDITION THAT MATTERS, and it was
        # missing. This fallback rescues a draft Telegram would not take — so it needs a
        # draft to exist. It was gated only on "Telegram did not send", and a SKIPPED
        # Telegram step is indistinguishable from a failed one by that test: on a card run
        # the build is skipped, nothing is drafted, and this fired anyway and died on
        # `--body-file draft.md: no such file`. A rescue step that fails the run when there
        # was nothing to rescue turns a working card into a red job.
        if: >-
          steps.when.outputs.quiet != 'true' && steps.build.outcome == 'success'
          && steps.build.outputs.empty != 'true' && steps.telegram.outputs.sent != 'true'
        # Created here rather than by hand, so it is not a piece of setup that can be
        # missing. `gh label create` exits non-zero when the label already exists, which is
        # the normal case from the second run onward, so that is not an error.
        run: |
          if gh label create "social-draft" \
               --description "An X post drafted by the scheduled job, waiting for review" \
               --color "1D9BF0" 2>/dev/null; then
            echo "created the social-draft label"
          else
            echo "social-draft label already exists"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: File it as an issue instead
        # Only when Telegram is not configured, or did not take it. Never both — two copies
        # of the same draft is two things to check and one of them to forget.
        # `steps.build.outcome == 'success'` IS THE CONDITION THAT MATTERS, and it was
        # missing. This fallback rescues a draft Telegram would not take — so it needs a
        # draft to exist. It was gated only on "Telegram did not send", and a SKIPPED
        # Telegram step is indistinguishable from a failed one by that test: on a card run
        # the build is skipped, nothing is drafted, and this fired anyway and died on
        # `--body-file draft.md: no such file`. A rescue step that fails the run when there
        # was nothing to rescue turns a working card into a red job.
        if: >-
          steps.when.outputs.quiet != 'true' && steps.build.outcome == 'success'
          && steps.build.outputs.empty != 'true' && steps.telegram.outputs.sent != 'true'
        run: |
          gh issue create \
            --title "X draft — ${{ steps.when.outputs.pretty }}" \
            --body-file draft.md \
            --label "social-draft"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send you the menu of angles
        # NOT A POST. This goes to you, not to a channel, and its job is to be chosen from.
        #
        # The draft above picks ONE angle and offers it. On most days that is a streak, and
        # a streak alone is the weakest thing this site finds: it says what a team keeps
        # doing and nothing about who they play, what the game will look like, or what the
        # price is. Five clears can be five coin flips. So the menu follows the draft with
        # every kind of angle the site has — streaks, mismatches, chase spots, and any real
        # price the model beats — numbered, so a better one can go out instead.
        #
        # AFTER the draft is delivered, and never fatal. The post is the thing that has to
        # happen; the menu is a second opinion, and a second opinion that fails should not
        # take the day's post down with it.
        #
        # Skipped on a quiet day — Thursday is silent, and a menu is still a notification.
        # RUNS ON THURSDAY TOO, and that is not a contradiction of the quiet day. Thursday
        # is silent towards an AUDIENCE — no X draft, no channel card. The menu has no
        # audience but you, and the week's own description of Thursday is "scan the
        # weekend", which needs something to scan.
        if: inputs.board == '' && env.TG_TOKEN != ''
        run: |
          node tools/social_draft.mjs --board menu --days 3 --out menu.md --json-out menu.json || {
            echo "::warning::could not build the angle menu — the post above is unaffected"; exit 0; }
          if [ ! -s menu.md ]; then
            echo "::notice::no angles on any of the four boards — no menu to send"
            exit 0
          fi
          python3 - <<'PY' > menu_payload.json
          import json, os
          d = json.load(open("menu.json"))
          print(json.dumps({"chat_id": os.environ["TG_CHAT"],
                            "text": d["post"], "disable_web_page_preview": True}))
          PY
          # Plain text, no parse_mode, for the same reason every other send here is: the
          # body carries team names with slashes and accents in them, and a message that
          # fails to parse is a message that never arrives.
          code=$(curl -s -o tgm.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H 'content-type: application/json' --data-binary @menu_payload.json || true)
          if [ "$code" = "200" ]; then
            echo "::notice::angle menu sent — $(python3 -c "import json;print(json.load(open('menu.json'))['note'])")"
          else
            # angleMenu rebuilds itself smaller until it is under Telegram's 4096, so a 400
            # here is something else — worth seeing in the log, not worth failing the run.
            echo "::warning::angle menu send failed (HTTP $code)"
            head -c 400 tgm.json || true
          fi
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thecornermodel.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Send you the day's best game, with the animation
        # THE PICK, EVERY DAY, AS ITS OWN MESSAGE.
        #
        # The week's public rotation is unchanged: Monday still reviews, Wednesday still
        # does streaks and the weekend card. But those days left you with no single game to
        # look at, and the animation — which is the thing that stops a thumb — only ever
        # gets rendered for the `game` board. So the best pick now goes out every day
        # regardless of what the day is publishing.
        #
        # SEPARATE, NOT MERGED. It carries its own Post on X button and its own clip, and
        # folding it into the day's draft would mean one message with two posts in it and
        # no way to tell which button belonged to which.
        #
        # SKIPPED WHEN THE DAY IS ALREADY A GAME — Tue, Fri, Sat, Sun — because on those
        # days the draft above IS this, rendered from the same call. Sending it twice is
        # how a daily poster teaches you to ignore it.
        #
        # RUNS ON THURSDAY, like the menu. Thursday is silent towards an audience; this has
        # no audience but you, and "scan the weekend" needs something to scan.
        if: inputs.board == '' && steps.when.outputs.board != 'game' && env.TG_TOKEN != ''
        run: |
          # Thursday's plan window is 0 because Thursday publishes nothing. For a scan of
          # what is coming, three days is the useful horizon.
          DAYS='${{ steps.when.outputs.plandays }}'
          [ "${DAYS:-0}" -lt 1 ] && DAYS=3
          node tools/social_draft.mjs --board game --days "$DAYS" \
            --out best.md --json-out best.json || {
              echo "::warning::could not build the day's best game — the rest of the run is unaffected"
              exit 0; }
          if [ ! -s best.md ]; then
            echo "::notice::no game carries a run worth posting on its own today"
            exit 0
          fi

          # THE CLIP. Same renderer the scheduled game post uses, installed here because on
          # Monday and Wednesday nothing above this point has needed a browser. Every
          # failure is a warning: a post that goes out as text is a post, and dying on a
          # graphic would cost the pick for the sake of decoration.
          FILE=""
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('best.json')).get('story') else 1)"; then
            python3 -c "import json; json.dump(json.load(open('best.json'))['story'], open('best_args.json','w'))"
            npm i --no-save playwright@1.49.1 >/dev/null 2>&1 \
              && npx playwright install chromium >/dev/null 2>&1 || \
              echo "::warning::could not install the browser — text only"
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -qq >/dev/null 2>&1 \
                && sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null 2>&1 \
                || echo "::warning::could not install ffmpeg"
            fi
            if command -v ffmpeg >/dev/null 2>&1 \
               && node tools/render_story.mjs --args best_args.json --video best.mp4; then
              FILE=best.mp4
            elif node tools/render_story.mjs --args best_args.json --out best.png; then
              echo "::warning::could not encode the animation — sending the still"
              FILE=best.png
            else
              echo "::warning::the render failed — sending text only"
            fi
          else
            echo "::notice::no fixture curve in this pick — text only"
          fi

          python3 - <<'PY' > best_payload.json
          import json, os
          d = json.load(open("best.json"))
          body = (f"⭐ Best game today — {os.environ['PRETTY']}\n"
                  f"{d['note']} · {d['weight']}/280\n\n"
                  f"{d['post']}")
          print(json.dumps({
              "chat_id": os.environ["TG_CHAT"], "text": body,
              "disable_web_page_preview": True,
              "reply_markup": {"inline_keyboard": [[
                  {"text": "Post on X", "url": d["intent"]}]]}}))
          PY

          if [ -n "$FILE" ] && [ -s "$FILE" ]; then
            code=$(curl -s -o tgb.json -w '%{http_code}' --max-time 120 \
              -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
              -F "chat_id=$TG_CHAT" -F "document=@$FILE" \
              -F "caption=$(python3 -c "import json;print(json.load(open('best_payload.json'))['text'])")" \
              -F "reply_markup=$(python3 -c "import json;print(json.dumps(json.load(open('best_payload.json'))['reply_markup']))")" \
              || true)
            echo "sendDocument HTTP $code"
            [ "$code" = "200" ] && { echo "::notice::best game sent with the clip"; exit 0; }
            echo "::warning::sendDocument failed (HTTP $code) — falling back to text"
          fi
          code=$(curl -s -o tgb.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H 'content-type: application/json' --data-binary @best_payload.json || true)
          if [ "$code" = "200" ]; then
            echo "::notice::best game sent as text"
          else
            # Never fatal. The day's own draft has already gone; losing this costs a
            # second opinion, not the day.
            echo "::warning::best game send failed (HTTP $code)"
          fi
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thecornermodel.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRETTY: ${{ steps.when.outputs.pretty }}

      - name: Send the card to the channel
        # BOTH CARD DAYS, and it used to be only one of them.
        #
        # This was gated on weekday == 3, so the WEEKEND card went out on Wednesday and
        # the midweek card — published on Monday, frozen on Monday, and graded in the
        # record ever since — was never sent to anybody. It was computed, it was on the
        # site, and members got one card a week in the channel rather than two. Nothing
        # failed: there was simply no step for it.
        #
        # The gate is now `card != ''`, which is the same condition the freeze step below
        # uses, so a card cannot be frozen and graded without also being sent. Those two
        # drifting apart is exactly what happened.
        #
        # SEPARATE FROM THE PUBLIC POST on purpose. The daily post goes out on the DAY of
        # the game, which is the worst moment to hear about it — by Saturday lunchtime the
        # market has found the same game and the price has gone. This gets Sunday's card
        # in front of a paying member on Wednesday, while it is still there to take. The
        # product is earlier information, not different information.
        #
        # It carries the model's numbers, which no public post does. Never sent to X: it
        # has no intent link and is far past 280 characters by design.
        #
        # NO --days. The tool asks the backend which card is live and what it covers —
        # see the note above the `card` board in social_draft.mjs for why passing a window
        # from here is what made the channel and the site disagree.
        #
        # ALSO RUNS ON A MANUAL `board: card`, which is the only way to get a card on a day
        # the schedule does not publish one. Whether it POSTS is a separate question — see
        # the `send` input.
        if: >-
          (steps.when.outputs.card != '' || inputs.board == 'card') && env.TG_TOKEN != ''
        run: |
          node tools/social_draft.mjs --board card --out card.md --json-out card.json \
            ${COUNT:+--count "$COUNT"}
          if [ ! -s card.md ]; then
            # The tool prints its own reason on the way out — a dead card says WHICH of
            # "no fixtures", "nothing qualified" and "data too stale to publish" it was,
            # and those are three different things to do about it.
            echo "::notice::no ${{ steps.when.outputs.card }} card today — see the SKIP line above"
            exit 0
          fi
          # READABLE WITHOUT BEING PUBLISHED. A card posted to the paid channel cannot
          # be unposted, so it is written here first and sent only if asked.
          {
            echo "### ${{ steps.when.outputs.card || 'card' }}"
            echo '```'
            cat card.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # AND TO THE LOG. The step summary is a separate artefact that the job log does
          # not contain, so a card "built but not sent" was unreadable from the one place
          # anybody looks when they want to know what a run did.
          echo "----- card -----"
          cat card.md
          echo "----- end -----"
          if [ -n "${{ inputs.board }}" ] && [ "${{ inputs.send }}" != "true" ]; then
            echo "::notice::card built, NOT sent — re-run with send: true to post it"
            exit 0
          fi
          python3 - <<'PY' > card_payload.json
          import json, os
          d = json.load(open("card.json"))
          print(json.dumps({"chat_id": os.environ["TG_CHAT"],
                            "text": d["post"], "disable_web_page_preview": True}))
          PY
          code=$(curl -s -o tgc.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H 'content-type: application/json' --data-binary @card_payload.json || true)
          if [ "$code" = "200" ]; then
            echo "::notice::${{ steps.when.outputs.card }} card sent to Telegram"
          else
            # Not fatal. The public post has already gone; losing the card costs a nudge,
            # not the day, and failing here would make a green run look red for it.
            echo "::warning::${{ steps.when.outputs.card }} card send failed (HTTP $code)"
          fi
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thecornermodel.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          COUNT: ${{ inputs.count }}

      - name: Send the streak finder to the channel
        # MONDAY AND THURSDAY, on its own schedule — not the card's. Monday posts the
        # weekend (Fri-Mon), Thursday the midweek (Tue-Thu), and between them every day
        # belongs to exactly one drop. The card above runs Monday and Wednesday on
        # different windows; the two are deliberately not folded together.
        #
        # ALSO RUNS ON A MANUAL `board: finder`, which is the only way to get one on a day
        # the schedule does not publish. Whether it POSTS is the `send` input, exactly as
        # for the card — and the finder is excluded from the draft step and the generic
        # Telegram step above so that flag governs the ONLY place this can send. That is
        # the bug the card note describes, and repeating it here would be repeating it
        # knowingly.
        #
        # THURSDAY IS A QUIET DAY AND THIS STEP POSTS ANYWAY, DELIBERATELY. `quiet` silences
        # the X draft — postPlan.js says the week has nothing to SAY on a Thursday — and the
        # finder is not that. It is the paid channel's midweek list, and Thursday is the day
        # it covers Tuesday to Thursday. So `steps.when.outputs.quiet` is absent from this
        # condition ON PURPOSE. Adding it to "respect the quiet day" would delete half the
        # schedule and leave a workflow that still looked correct.
        if: >-
          (steps.when.outputs.finder != '' || inputs.board == 'finder')
          && env.TG_TOKEN != ''
        run: |
          node tools/social_draft.mjs --board finder --out finder.md --json-out finder.json
          if [ ! -s finder.md ]; then
            # The tool prints its own reason — "no streaks clear the bar" and "data too
            # stale to publish" are different things to do something about.
            echo "::notice::no streak finder today — see the SKIP line above"
            exit 0
          fi
          # READABLE WITHOUT BEING PUBLISHED, and in BOTH places: the step summary is a
          # separate artefact the job log does not contain, so a post "built but not sent"
          # was unreadable from the one place anybody looks.
          {
            echo "### streak finder"
            echo '```'
            cat finder.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "----- finder -----"
          cat finder.md
          echo "----- end -----"
          if [ -n "${{ inputs.board }}" ] && [ "${{ inputs.send }}" != "true" ]; then
            echo "::notice::finder built, NOT sent — re-run with send: true to post it"
            exit 0
          fi
          python3 - <<'PY' > finder_payload.json
          import json, os
          d = json.load(open("finder.json"))
          print(json.dumps({"chat_id": os.environ["TG_CHAT"],
                            "text": d["post"], "disable_web_page_preview": True}))
          PY
          code=$(curl -s -o tgf.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H 'content-type: application/json' --data-binary @finder_payload.json || true)
          if [ "$code" = "200" ]; then
            echo "::notice::streak finder sent to Telegram"
          else
            # Not fatal, same as the card: the text is in the log and the summary above,
            # and failing here would make an otherwise good run look red.
            echo "::warning::streak finder send failed (HTTP $code)"
            cat tgf.json || true
          fi
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thecornermodel.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Freeze the card
        # TWO DROPS A WEEK, ON THE DAYS THE CARDS GO OUT.
        #
        # It was Friday-only (weekend product), then every day (so midweek games were
        # gradeable at all). Daily fixed the coverage and created a new problem: it froze
        # the top 25 every night, which on a ten-fixture Tuesday is the whole board
        # including the bottom of it, and a quiet midweek wrote down as many claims as a
        # full weekend.
        #
        # Now it freezes when a card is actually published — Monday for the midweek,
        # Wednesday for the weekend — and the backend marks `qualified` only for rows
        # inside that card's window. COVERAGE IS UNCHANGED: Monday covers Tue-Thu and
        # Wednesday covers Fri-Mon, so every day of the week still belongs to exactly one
        # frozen card and nothing becomes ungradeable.
        #
        # Nothing here can be backfilled. A streak recomputed after the game is a claim
        # made with the benefit of the result — the survivors, which is precisely the
        # survivorship bias snapshotting exists to prevent.
        #
        # Still LAST in the job, and still after the draft is delivered: a snapshot
        # failure must not cost the post.
        if: steps.when.outputs.card != ''
        run: |
          # The scan has to reach the far end of the card: Monday needs Thursday (4 days),
          # Wednesday needs the Monday after (6). The backend applies the card's own window
          # on top, so a wider scan costs nothing but a longer list to filter.
          code=$(curl -s -o snap.json -w '%{http_code}' --max-time 120 -X POST \
            "$BACKEND/api/streaks/snapshot?token=$TOOLS_TOKEN" \
            -H 'content-type: application/json' \
            -d "{\"tag\":\"${{ steps.when.outputs.tag }}\",\"days\":${{ steps.when.outputs.carddays }},\"limit\":25,\"card\":\"${{ steps.when.outputs.card }}\"}" || true)
          # The token is in the URL, so the BODY is safe to print but the request is not.
          echo "HTTP $code"
          case "$code" in
            200) ;;
            403) echo "::error::backend rejected the token — check the TOOLS_TOKEN secret"; exit 1 ;;
            *)   echo "::error::snapshot failed (HTTP $code) — this weekend cannot be graded"; exit 1 ;;
          esac
          status=$(python3 -c "import json,sys; print(json.load(open('snap.json')).get('status',''))")
          count=$(python3 -c "import json,sys; print(len(json.load(open('snap.json')).get('entries') or []))")
          case "$status" in
            created) echo "::notice::froze the ${{ steps.when.outputs.card }} card — $count streaks as tag ${{ steps.when.outputs.tag }}" ;;
            exists)  echo "::notice::already snapshotted today ($count streaks) — left untouched" ;;
            stale)
              echo "::error::data too old to snapshot — this card will not be gradeable"; exit 1 ;;
            *) echo "::error::unexpected snapshot status '$status'"; exit 1 ;;
          esac
        env:
          BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
