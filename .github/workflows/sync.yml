# Keeps the data refreshing twice a day, every 12 hours — and needs NO configuration.
#
# HOW IT WORKS, and why it is only a ping:
#
# The backend already knows how to sync itself, in two places:
#   - `_maybe_sync_on_boot` runs on STARTUP and syncs if the newest data is more than
#     STALE_HOURS (12) old.
#   - an in-process APScheduler fires at 07:00 and 19:00 UTC.
#
# Neither was reliable, for one reason: Render spins down idle instances, a sleeping
# process runs no cron jobs, and nothing was waking it. That is the whole bug — the code
# was fine, it just was not running.
#
# So this workflow does the one thing the backend cannot do for itself: WAKE IT UP.
# Waking a sleeping instance is a process start, which triggers the boot sync. If the
# instance is already awake, its own scheduler covers the same two times. Between them
# both cases are handled.
#
# WHAT THIS DELIBERATELY AVOIDS: calling the sync endpoint directly. That endpoint spends
# API credits so it is TOOLS_TOKEN-gated, which would mean storing a secret and keeping it
# in step with Render. A plain GET needs no secret and cannot be abused, and the schedule
# still runs twice a day. Fewer moving parts, nothing to configure, nothing to expire.
name: Sync corner data

on:
  schedule:
    # Twice a day, every 12 hours. GitHub cron is best-effort and can run a few minutes
    # late under load, which does not matter for a twice-daily data pull.
    - cron: "0 7,19 * * *"

concurrency:
  group: corner-sync
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Repo variable if set, else the deployed backend. Not a secret — this URL is
      # already baked into the public frontend bundle.
      BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
    steps:
      - uses: actions/checkout@v4      # for the reporting script below

      - name: Wake the backend
        # Render cold starts take up to a minute and the first request usually times out,
        # so this keeps trying rather than giving up on one slow response.
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND/api/" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "backend awake — startup will sync if the data is over 12h old"
              exit 0
            fi
            sleep 15
          done
          echo "::error::backend did not respond after 8 attempts (~2 min) — it may be down"
          exit 1

      - name: Report what happened
        # A boot sync is a detached subprocess, so this is a progress check, not a
        # completion check. It exists so a dead sync shows up in the log instead of
        # leaving a green tick behind stale data — which is how this went unnoticed for
        # two days, twice.
        run: |
          sleep 90
          curl -s --max-time 60 "$BACKEND/api/sync/runs?limit=3" > runs.json || true
          python3 .github/workflows/report_sync.py < runs.json
