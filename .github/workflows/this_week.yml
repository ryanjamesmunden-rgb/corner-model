# Today's board, in the three sections the EV sheet is built from. Markdown to read, and
# the spreadsheet to fill in, from one call.
#
# WHY THIS EXISTS. The results page grades what the streak board claimed before kick-off,
# and the question "so what is it claiming for the NEXT few days" had no answer that did
# not involve signing in and reading three screens. The rows behind all of them come from
# one tools-token endpoint, /api/share/rows, and the runner holds the token.
#
# DAILY, NOT WEEKLY, AND THE HORIZON SHRANK WITH IT. This was a Monday-ish dispatch
# covering six days, which matched a sheet built by hand once a week. Six days of rows
# refreshed every morning would mostly be the same fixtures re-listed, with the prices
# typed into yesterday's copy stranded in yesterday's download — the sheet is only worth
# opening if what is in it can still be backed today.
#
# So the schedule covers THREE days: today, tomorrow, and the day after. Three rather than
# two because a price typed on the morning of a game is often already gone — the market
# finds the same fixture — and the weekend card exists precisely to get ahead of that. The
# streak snapshot freezes two days, so the third day's rows are not on record yet; they
# will be when tomorrow's run freezes them. Nothing is lost by showing them early.
#
# A six-day view is still one dispatch away: run it by hand with days: 6.
#
# THREE SECTIONS, BECAUSE THEY ANSWER DIFFERENT QUESTIONS and the hand-built sheet this
# replaces kept them apart for good reason:
#
#   streaks     this team keeps clearing this line — a run, and nothing about the opponent
#   mismatches  this attack against THIS defence — about the fixture, not the form
#   chase       this team is behind early and chases — about game state, not the season
#
# Collapsing them into one ranked list would hide which kind of reason each row rests on,
# and they fail in different weather: a streak is a coin that has landed five heads, a
# mismatch is an opponent who might have signed a defender, a chase needs the game to go
# the way it usually does.
#
# NO BOOK ODDS AND THEREFORE NO EV. The model's fair price is here; a bookmaker's is not,
# except on the few fixtures where a price has been entered by hand on /prices. That half
# of the sheet stays manual, and the table says so rather than printing a blank column
# that reads as "no edge".
name: Today's board

on:
  schedule:
    # 07:00 UTC — before the day's first kick-offs, and before the 11:00 draft, so the
    # spreadsheet is waiting by the time there is anything to price up. GitHub delays
    # scheduled runs routinely; nothing here cares what hour it lands on.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to cover (blank = 3)"
        required: false
        default: "3"
        type: string
      limit:
        description: "Most rows per section"
        required: false
        default: "15"
        type: string

concurrency:
  group: corner-this-week

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Needed for tools/board_xlsx.py. The markdown half never needed the repo.
      - uses: actions/checkout@v4

      - name: What day is it
        id: when
        run: |
          echo "tag=$(TZ=Europe/London date +%F)" >> "$GITHUB_OUTPUT"
          echo "pretty=$(TZ=Europe/London date '+%a %d %b')" >> "$GITHUB_OUTPUT"

      - name: Ask the backend
        env:
          BACKEND: ${{ vars.BACKEND_URL || 'https://corner-model.onrender.com' }}
          TOOLS_TOKEN: ${{ secrets.TOOLS_TOKEN }}
          DAYS: ${{ inputs.days }}
          LIMIT: ${{ inputs.limit }}
        run: |
          # Render sleeps the free instance; the first call after a quiet spell can take
          # most of a minute or fail outright, which is not a data problem.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND/api/" || true)
            echo "wake attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          # All three boards in ONE call. Each is a full pass over every team, so three
          # requests would be three of the same expensive scan on a free instance.
          code=$(curl -s -o rows.json -w '%{http_code}' --max-time 180 \
            "$BACKEND/api/share/rows?token=$TOOLS_TOKEN&days=${DAYS:-3}&limit=${LIMIT:-15}&boards=streaks,mismatches,chase" \
            || echo 000)
          echo "share/rows: HTTP $code"
          printf '%s' "$code" > code.txt
          [ "$code" = "200" ] || echo '{}' > rows.json

      # THE FILL-IN SHEET, built from the same rows the tables below are drawn from.
      #
      # WHY A SPREADSHEET AND NOT JUST THE TABLES. The model produces a fair price. A
      # bookmaker's price is the one number it cannot know, and without it there is no EV
      # and no bet — so the last step of this is always a person typing what the market is
      # offering. That was being done in a workbook rebuilt from scratch each week. This
      # writes the same workbook straight off the board, with the EV and the verdict as
      # live formulas, so the only manual work left is the part that actually needs a human.
      #
      # NEVER FATAL. The tables below are the thing this workflow promises; a failure to
      # build the attachment must not cost them. Every exit here is a warning.
      - name: Build the fill-in spreadsheet
        id: sheet
        run: |
          rows=$(python3 -c "
          import json
          try: d = json.load(open('rows.json'))
          except Exception: d = {}
          print(sum(len(d.get(k) or []) for k in ('streaks','mismatches','chase')))
          ")
          # An empty workbook is worse than no workbook: it downloads, opens, and looks
          # like the model found nothing, when what happened was the backend was asleep.
          if [ "${rows:-0}" -lt 1 ]; then
            echo "::notice::no rows on any board — no spreadsheet to build"
            exit 0
          fi
          python3 -m pip install --quiet openpyxl || {
            echo "::warning::could not install openpyxl — no spreadsheet this run"; exit 0; }
          out="corner-board-${{ steps.when.outputs.tag }}.xlsx"
          python3 tools/board_xlsx.py rows.json "$out" || {
            echo "::warning::the spreadsheet build failed — the tables below are unaffected"
            exit 0; }
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"

      - name: Attach it to the run
        if: steps.sheet.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: corner-board-${{ steps.when.outputs.tag }}
          path: ${{ steps.sheet.outputs.file }}
          # A board is about fixtures in the next three days. A download from a fortnight
          # ago is a list of games that have already been played, and keeping it for the
          # default ninety is ninety copies of a sheet nobody can act on.
          retention-days: 14
          if-no-files-found: error

      # LAST, AND TO BOTH PLACES. The runner echoes every line of this script into the log
      # before running it, so anything printed by an earlier step is pushed beyond what the
      # logs API returns. The tables have to be the final thing the job prints, and they go
      # to the step summary and the log together — output nobody can reach is not output.
      - name: The board
        env:
          SHEET: ${{ steps.sheet.outputs.file }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          try:
              data = json.load(open("rows.json"))
          except Exception:
              data = {}
          try:
              code = open("code.txt").read().strip()
          except Exception:
              code = "000"

          LON = ZoneInfo("Europe/London")

          def when(iso):
              try:
                  dt = datetime.fromisoformat((iso or "").replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(LON).strftime("%a %d %b %H:%M")
              except Exception:
                  return (iso or "")[:10]

          def fixture(row):
              """Home v Away, and which side the angle is on — the sheet's Venue column."""
              nf = row.get("next_fixture") or {}
              home = row["name"] if nf.get("is_home") else nf.get("opponent", "?")
              away = nf.get("opponent", "?") if nf.get("is_home") else row["name"]
              return when(nf.get("date")), f"{home} v {away}", \
                  ("Home" if nf.get("is_home") else "Away")

          def num(v, dp=2):
              return "—" if v is None else (f"{v:.{dp}f}" if isinstance(v, float) else str(v))

          age = data.get("data_age_hours")
          days = data.get("within_days")

          print("## The next %s days\n" % (days if days is not None else "?"))
          if code != "200":
              print(f"> ⚠️ **The backend did not answer** (`/api/share/rows` returned "
                    f"`{code}`). A 403 means the TOOLS_TOKEN secret does not match the "
                    "backend's; anything else is usually Render asleep — try again.\n")
          # THE AGE IS SAID FIRST. The Friday snapshot refuses to freeze data older than
          # fourteen hours, and a board read off stale numbers is the same mistake with
          # nothing to stop it.
          elif age is None or age > 14:
              print(f"> ⚠️ **Data is {age if age is not None else 'of unknown age'} hours "
                    "old.** The snapshot would refuse this — read it as last sync's board.\n")
          else:
              print(f"> Data {age}h old · kick-offs in London time\n")

          # ---------------- streaks ----------------
          rows = data.get("streaks") or []
          print("### Streaks — this team keeps clearing this line\n")
          if not rows:
              print("_Nothing clears the bar in this window._\n")
          else:
              print("| Kick-off | League | Team | V | Fixture | Line | Run | Hit% | Avg |")
              print("|---|---|---|---|---|---|---|---|---|")
              for r in rows:
                  ko, fx, venue = fixture(r)
                  run = f"{r.get('hits',0)}/{r.get('settled', r.get('window',0))}"
                  if r.get("voids"):
                      run += f"+{r['voids']}v"
                  cur = (r.get("streak") or {}).get("length")
                  if cur:
                      run += f" ({cur} in a row)"
                  print(f"| {ko} | {r.get('league_name','')} | **{r['name']}** | {venue} "
                        f"| {fx} | {r.get('line_label','')} | {run} "
                        f"| {num(r.get('hit_rate'), 1)} | {num(r.get('avg'))} |")
              print()

          # ---------------- mismatches ----------------
          rows = data.get("mismatches") or []
          print("### Mismatches — this attack against THIS defence\n")
          if not rows:
              print("_No fixture clears the mismatch bar in this window._\n")
          else:
              print("| Kick-off | League | Team | V | Fixture | Line | Wins/g | Opp concedes/g | Prob | Fair |")
              print("|---|---|---|---|---|---|---|---|---|---|")
              for r in rows:
                  ko, fx, venue = fixture(r)
                  print(f"| {ko} | {r.get('league_name','')} | **{r.get('name') or r.get('team','')}** "
                        f"| {venue} | {fx} | {r.get('line','')}+ "
                        f"| {num(r.get('team_for'))} | {num(r.get('opp_conceded'))} "
                        f"| {num(r.get('prob'), 1)}% | {num(r.get('fair_odds'))} |")
              print()

          # ---------------- chase ----------------
          rows = data.get("chase") or []
          print("### Chase — this team goes behind early and chases\n")
          if not rows:
              print("_No chase spot clears the bar in this window._\n")
          else:
              print("| Kick-off | League | Team | V | Fixture | Line | λ | L5 | Opp 1H | Prob | Fair | Book | EV |")
              print("|---|---|---|---|---|---|---|---|---|---|---|---|---|")
              for r in rows:
                  ko, fx, venue = fixture(r)
                  l5 = f"{r.get('consistency','?')}/{r.get('consistency_of','?')}"
                  ev = r.get("ev")
                  print(f"| {ko} | {r.get('league_name','')} | **{r['name']}** | {venue} "
                        f"| {fx} | {r.get('line','')}+ | {num(r.get('lambda'))} | {l5} "
                        f"| {num(r.get('opp_fh_rate'), 0)}% | {num(r.get('prob'), 1)}% "
                        f"| {num(r.get('fair_odds'))} | {num(r.get('book_odds'))} "
                        f"| {'—' if ev is None else f'{ev:+.1f}%'} |")
              print()

          # SAID EVERY TIME, because the sheet this replaces had EV columns and these
          # mostly do not. A fair price with no book price beside it is a lead to check,
          # not an edge — and the gap is where the hand-work still is.
          print("---")
          # WHERE THE SHEET IS, said in the summary rather than only in a step log. An
          # artifact nobody knows is there is an artifact nobody downloads.
          sheet = os.environ.get("SHEET") or ""
          if sheet:
              print(f"📄 **`{sheet}`** is attached to this run — scroll to the bottom of "
                    "the run page for it. Type the bookmaker's odds into the yellow "
                    "**Book** column and the EV and verdict fill themselves in.\n")
          else:
              print("_No spreadsheet this run — see the build step above for why._\n")
          print("_λ is the model's expected corner count. **Fair** is the model's price; "
                "**Book** and **EV** appear only where a price has been entered on "
                "/prices, so most rows carry none — those are leads to price up, not "
                "bets. Lines are the model's, not a bookmaker's._")
          PY
