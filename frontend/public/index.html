<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- The brand's ground, not black. #000000 was the default CRA ships and it is a
             different colour from every surface on the site, so the phone chrome above the
             page did not match the page. -->
        <meta name="theme-color" content="#0B0F14" />
        <meta name="description" content="The Corner Model — corner models priced against every book: fair odds, every bookmaker's price, and the edge on it." />

        <!-- THE LINK CARD. There was none, so every link posted to Telegram, X or WhatsApp
             rendered as a bare URL — no title, no picture, nothing to click. That is the
             one piece of branding that travels off the site, and it was the piece missing.
             Absolute URLs because a crawler resolves these against nothing: a relative
             path here fetches no image at all.
             og:image must be a real file at a real size — 1200x630 is the ratio X and
             Telegram both crop to, and a smaller one is shown as a thumbnail beside the
             text rather than as a card. -->
        <meta property="og:site_name" content="The Corner Model" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://thecornermodel.com/" />
        <meta property="og:title" content="The Corner Model" />
        <meta property="og:description" content="Cornered the market. Corner models priced against every book — fair odds, every bookmaker's price, and the edge on it." />
        <meta property="og:image" content="https://thecornermodel.com/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="The Corner Model 3.0 — cornered the market." />
        <!-- summary_large_image, not summary: the small card crops to a square and the
             wordmark loses its ends. -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="The Corner Model" />
        <meta name="twitter:description" content="Cornered the market. Corner models priced against every book — fair odds, every bookmaker's price, and the edge on it." />
        <meta name="twitter:image" content="https://thecornermodel.com/og.png" />

        <!-- THE ICON. There was none at all before this, so a tab, a bookmark and a link
             preview all fell back to the letter the host derives from the domain — a grey
             T. Four entries because no single file covers the field:
               favicon.svg   what modern browsers prefer, and the only one that stays sharp
               favicon.ico   still requested BY NAME at the site root by Windows, older
                             Safari and most feed readers, whatever the link tags say
               apple-touch   iOS home screen, which ignores both of the above
               manifest      Android home screen and the installable-app icon -->
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>The Corner Model</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
